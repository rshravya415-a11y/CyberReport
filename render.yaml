services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: cyberreport-backend
    runtime: docker
    dockerfilePath: ./backend/backend/Dockerfile
    dockerContext: ./backend/backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

  # 2. React Vite Frontend Static Site
  - type: web
    name: cyberreport-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
