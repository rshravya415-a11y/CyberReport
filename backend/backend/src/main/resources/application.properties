
spring.application.name=Cyber_report
server.port=${PORT:8080}

# ─── Database ────────────────────────────────────────────────────────────────
# Supports Render (SPRING_DATASOURCE_URL), Railway (MYSQLHOST/MYSQLPORT/etc.), and Localhost
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:cyberreport}?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&sslMode=PREFERRED}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${MYSQL_USER:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:root}}}

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ─── Multipart (evidence uploads) ────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ─── Error responses ─────────────────────────────────────────────────────────
server.error.include-message=always

# ─── Session (for HttpSession-based auth) ────────────────────────────────────
server.servlet.session.timeout=24h
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
